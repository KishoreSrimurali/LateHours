<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="robots" content="index, follow" />

    <title>Late Hours — Free Anonymous Peer Support, Day or Night</title>
    <meta name="description" content="Talk to a real, trained listener by voice, video, or text — free, anonymous, no appointment needed. Peer support, not therapy or a crisis line." />
    <link rel="canonical" href="https://latehours.org/" />

    <!-- Open Graph / Twitter Card -- static so link-preview bots (which
         don't execute JS) get real values instead of falling back to
         nothing. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Late Hours" />
    <meta property="og:url" content="https://latehours.org/" />
    <meta property="og:title" content="Late Hours — Free Anonymous Peer Support, Day or Night" />
    <meta property="og:description" content="Late Hours connects you to a real listener by voice, video, or text. No names, no history, no appointment — free, anonymous, day or night." />
    <meta property="og:image" content="https://latehours.org/logo.png" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Late Hours — Free Anonymous Peer Support, Day or Night" />
    <meta name="twitter:description" content="Late Hours connects you to a real listener by voice, video, or text. No names, no history, no appointment — free, anonymous, day or night." />
    <meta name="twitter:image" content="https://latehours.org/logo.png" />

    <link rel="icon" type="image/png" href="/logo.png?v=4" />
    <link rel="apple-touch-icon" href="/logo.png?v=4" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- preconnect starts the DNS/TLS handshake to Google Fonts' two
         hosts immediately, in parallel with everything else, instead of
         only discovering them once the stylesheet link below is parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://latehours.org/#website",
            "url": "https://latehours.org/",
            "name": "Late Hours",
            "description": "Free, anonymous peer support by voice, video, or text — no names, no appointment.",
            "inLanguage": "en"
          },
          {
            "@type": "Organization",
            "@id": "https://latehours.org/#organization",
            "name": "Late Hours",
            "url": "https://latehours.org/",
            "logo": "https://latehours.org/logo.png",
            "description": "Late Hours is an independent, donation-supported project connecting people to trained peer listeners for free, anonymous conversations. It is not a substitute for professional therapy or crisis services."
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
